services:
  caddy:
    image: caddy:2
  mongo:
    image: mongo:4.2
    volumes:
      - ./MongoDB:/data/db
  mongo-express:
    image: mongo-express:1.0.0-alpha.4
  web:
    build: ./Back-End
    environment:
      - MONGO_HOST=mongo
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RUNNER_REGISTRATION_TOKEN=${RUNNER_REGISTRATION_TOKEN:-dev-only-registration-token-change-me}
  sandbox:
    build: ./Sandbox
    # Share network namespace with web (and minio, which already shares with web).
    # Required because presigned URLs from backend embed 'localhost:9000' (browser-
    # accessible). Sandbox needs to reach MinIO at the same hostname as backend does.
    network_mode: "service:web"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - BACKEND_URL=http://localhost:8080
      - RUNNER_REGISTRATION_TOKEN=${RUNNER_REGISTRATION_TOKEN:-dev-only-registration-token-change-me}
      - RUNNER_NAME=sandbox-default
  redis:
    image: redis:7-alpine
    volumes:
      - ./redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
